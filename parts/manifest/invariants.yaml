invariant_set_version: "1.0.0-design"
status: "normative_design_contract"
invariants:
  - id: "INV-ID-001"
    severity: "critical"
    statement: "Discovery, planning, health, capacity, retry, billing, logs and UI must reference the same versioned canonical RouteID."
  - id: "INV-CONTRACT-001"
    severity: "critical"
    statement: "Health and eligibility are isolated by exact model endpoint and capability contract; one contract failure must not poison another."
  - id: "INV-DISCOVERY-001"
    severity: "high"
    statement: "Every enabled and authorized route inside protocol boundaries is discovered by default unless an explicit durable block excludes it."
  - id: "INV-REVISION-001"
    severity: "critical"
    statement: "Older catalog price health or policy revisions must never overwrite newer authoritative state."
  - id: "INV-FILTER-001"
    severity: "critical"
    statement: "Authorization scope blocks capability context price credential health and replay safety are hard filters before strategy ranking or affinity."
  - id: "INV-PRICE-001"
    severity: "critical"
    statement: "A route above the effective per-key or site absolute ratio ceiling is never selected."
  - id: "INV-PRICE-002"
    severity: "high"
    statement: "For price strategy a fresh successful eligibility signal admits the cheaper route without an additional fixed recovery cooldown."
  - id: "INV-DETERMINISM-001"
    severity: "high"
    statement: "Equal inputs and revisions produce a stable route order using normative integer arithmetic and canonical tie breaks."
  - id: "INV-CHANNEL-001"
    severity: "high"
    statement: "One request does not retry the same physical channel or credential failure through a different group alias."
  - id: "INV-HEALTH-001"
    severity: "critical"
    statement: "Global route evidence and per-key tolerance are separate; shared failures are not independently reprobed by every key."
  - id: "INV-HEALTH-002"
    severity: "critical"
    statement: "User errors content refusals and unrelated contract failures do not reduce route semantic health."
  - id: "INV-CAPACITY-001"
    severity: "critical"
    statement: "429 concurrency saturation and bounded queue state are capacity evidence and do not reduce semantic health."
  - id: "INV-CAPACITY-002"
    severity: "high"
    statement: "Capacity leases and waits are bounded cancellable and released exactly once."
  - id: "INV-PROBE-001"
    severity: "high"
    statement: "Probe success and real-user success are stored and displayed separately; probes do not inflate real SLA."
  - id: "INV-PROBE-002"
    severity: "critical"
    statement: "Probe execution obeys global and failure-domain budgets concurrency leases jitter retry-after and media eligibility."
  - id: "INV-RECOVERY-001"
    severity: "high"
    statement: "Ordinary failures always retain an automatic recovery path; only explicit administrator blocks stop recovery permanently."
  - id: "INV-RECOVERY-002"
    severity: "high"
    statement: "Persistent recovery jobs survive worker restart and are scheduled fairly by due time and failure domain."
  - id: "INV-MULTI-001"
    severity: "critical"
    statement: "Multi-instance workers use leases idempotent job IDs and monotonic revisions to prevent duplicate recovery storms."
  - id: "INV-CACHE-001"
    severity: "critical"
    statement: "Affinity never overrides authorization price ceiling health contract context capacity deadline or replay safety."
  - id: "INV-CACHE-002"
    severity: "high"
    statement: "Cache-economy predictions influence route choice only and never replace actual usage in billing."
  - id: "INV-CACHE-003"
    severity: "high"
    statement: "Missing stale or low-confidence learning evidence falls back to a deterministic auditable rule."
  - id: "INV-OUTCOME-001"
    severity: "critical"
    statement: "HTTP status alone is insufficient; success requires transport protocol and business-semantic validation for the exact contract."
  - id: "INV-COMMIT-001"
    severity: "critical"
    statement: "No cross-route retry occurs after the response has been semantically committed to the client."
  - id: "INV-REPLAY-001"
    severity: "critical"
    statement: "Retry requires both a retryable attributable outcome and a ReplayClass that permits replay at the current acceptance and commit state."
  - id: "INV-MEDIA-001"
    severity: "critical"
    statement: "Ambiguous or confirmed media acceptance is never blindly replayed across routes without a proven idempotency contract."
  - id: "INV-BILL-001"
    severity: "critical"
    statement: "Only the final actual route and actual usage are settled and all attempts share one immutable Route Receipt lineage."
  - id: "INV-BILL-002"
    severity: "critical"
    statement: "Price and route versions are frozen at request receipt creation; later configuration changes affect only later requests."
  - id: "INV-BILL-003"
    severity: "critical"
    statement: "Receipt state and host quota mutation are committed in one host transaction or an equivalent proven atomic service boundary."
  - id: "INV-BILL-004"
    severity: "critical"
    statement: "Billing arithmetic is bounded saturating non-negative and auditable; upstream success followed by local failure enters idempotent reconciliation without upstream replay."
  - id: "INV-EXPLAIN-001"
    severity: "medium"
    statement: "Every route decision and rejection has a stable machine reason code plus a role-appropriate human explanation."
  - id: "INV-SEC-001"
    severity: "critical"
    statement: "User-visible APIs never reveal upstream credentials private URLs internal channel topology or administrator-only metadata."
  - id: "INV-UNINSTALL-001"
    severity: "critical"
    statement: "Disable rollback uninstall and purge are separate actions; legitimate requests billing logs and active media obligations are preserved."
  - id: "INV-PRICE-003"
    severity: "critical"
    statement: "An explicit group-model price replaces the global model base; an inherited route uses the real global model price; the effective group ratio is applied exactly once, and incompatible billing units are never numerically ordered."
  - id: "INV-REPLAY-002"
    severity: "critical"
    statement: "Exhaustive fallback is sequential and restricted to replay-safe text; each eligible physical channel is attempted at most once, while media, state-bound, side-effecting, background, hosted-tool and committed requests never inherit this authority."
  - id: "INV-DISPATCH-001"
    severity: "critical"
    statement: "A side-effecting request may select one initial certified route, but after upstream dispatch starts no failure may select a second route; state-bound requests are rejected before upstream connection."
  - id: "INV-ADAPTER-001"
    severity: "critical"
    statement: "Adapter endpoint declarations may only narrow a certified contract; convert_request_failed may fall back only before dispatch, and HTTP 200 is successful only after exact protocol and business-semantic validation."
  - id: "INV-RUNTIME-001"
    severity: "critical"
    statement: "The serving Web process and dedicated Smart Router Worker run the same immutable binary and protocol revision before either may publish or consume shared routing state."
