matrix_version: "3.0.0-alpha.1"
status: "public_alpha_v0_3_candidate_not_release_evidence"
forms:
  full:
    name: "Full compatibility distribution"
    runnable_target: true
    parity_claim_allowed_when: "all mandatory conformance gates pass for the exact release"
  bridge:
    name: "Certified Bridge Add-on"
    runnable_target: true
    parity_claim_allowed_when: "host commit is certified and all mandatory conformance gates pass"
  integration:
    name: "Custom Fork Integration Kit"
    runnable_target: false
    parity_claim_allowed_when: "the generated host integration manifest proves all hooks and tests"
  parts:
    name: "Agent Parts Kit"
    runnable_target: false
    label: "Development Kit / Not runnable"
    parity_claim_allowed_when: "never for the kit itself; only a tested host implementation may claim parity"
  sidecar_lite:
    name: "Sidecar Lite experimental appendix"
    runnable_target: true
    parity_claim_allowed_when: "Lite capability manifest only"
