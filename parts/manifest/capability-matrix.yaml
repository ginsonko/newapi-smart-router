matrix_version: "1.0.0-design"
status: "design_only_not_release_evidence"
forms:
  full:
    name: "Full compatibility distribution"
    runnable_target: true
    parity_claim_allowed_when: "all mandatory conformance gates pass for the exact release"
  bridge:
    name: "Certified Bridge Add-on"
    runnable_target: true
    parity_claim_allowed_when: "host commit is certified and all mandatory conformance gates pass"
  integration:
    name: "Custom Fork Integration Kit"
    runnable_target: false
    parity_claim_allowed_when: "the generated host integration manifest proves all hooks and tests"
  parts:
    name: "Agent Parts Kit"
    runnable_target: false
    label: "Development Kit / Not runnable"
    parity_claim_allowed_when: "never for the kit itself; only a tested host implementation may claim parity"
  sidecar_lite:
    name: "Sidecar Lite experimental appendix"
    runnable_target: true
    parity_claim_allowed_when: "Lite capability manifest only"
capabilities:
  - id: "CAP-POLICY-001"
    name: "per-key routing policy"
    reference_status: "implemented_in_reference_fork"
    full: "release_target"
    bridge: "release_target"
    integration: "requires_hook"
    parts: "specification"
    sidecar_lite: "not_available"
  - id: "CAP-DISCOVERY-001"
    name: "blacklist-oriented automatic route discovery"
    reference_status: "implemented_in_reference_fork"
    full: "release_target"
    bridge: "release_target"
    integration: "portable"
    parts: "specification"
    sidecar_lite: "limited_global_view"
  - id: "CAP-STRATEGY-001"
    name: "price stability latency balanced and manual strategies"
    reference_status: "implemented_in_reference_fork"
    full: "release_target"
    bridge: "release_target"
    integration: "portable"
    parts: "algorithm_contract"
    sidecar_lite: "limited_global_view"
  - id: "CAP-HEALTH-001"
    name: "shared exact-contract health and self recovery"
    reference_status: "implemented_in_reference_fork"
    full: "release_target"
    bridge: "release_target"
    integration: "portable_with_persistence"
    parts: "state_machine_contract"
    sidecar_lite: "limited_global_view"
  - id: "CAP-RETRY-001"
    name: "semantic pre-commit safe retry"
    reference_status: "pending_frozen_semantic_baseline"
    full: "release_target"
    bridge: "release_target"
    integration: "requires_commit_and_outcome_hooks"
    parts: "state_machine_contract"
    sidecar_lite: "not_available"
  - id: "CAP-BILL-001"
    name: "actual-route atomic billing"
    reference_status: "implemented_in_reference_fork_requires_extraction_evidence"
    full: "release_target"
    bridge: "release_target"
    integration: "requires_host_transaction_hook"
    parts: "receipt_contract"
    sidecar_lite: "not_available"
  - id: "CAP-CACHE-001"
    name: "fixed and dynamic cache-economy affinity"
    reference_status: "implemented_in_reference_fork"
    full: "release_target"
    bridge: "release_target"
    integration: "portable_with_usage_evidence"
    parts: "algorithm_contract"
    sidecar_lite: "limited"
  - id: "CAP-MEDIA-001"
    name: "image video audio and async task routing"
    reference_status: "implemented_in_evolving_reference"
    full: "release_target"
    bridge: "release_target"
    integration: "requires_task_hooks"
    parts: "contract_and_replay_specification"
    sidecar_lite: "limited_no_atomic_idempotency"
  - id: "CAP-UI-001"
    name: "native user and administrator experience"
    reference_status: "implemented_in_reference_fork"
    full: "release_target"
    bridge: "thin_native_entry_plus_standalone"
    integration: "optional_host_integration"
    parts: "not_available"
    sidecar_lite: "standalone_only"
  - id: "CAP-REVERSIBLE-001"
    name: "receipt-backed install rollback and uninstall"
    reference_status: "design_target"
    full: "release_target"
    bridge: "release_target"
    integration: "must_be_proven_per_host"
    parts: "checklist_only"
    sidecar_lite: "proxy_level_only"
stable_release_blocks:
  - "semantic success baseline is not frozen into golden fixtures"
  - "smart state is not fully isolated into sr_* side tables"
  - "no exact upstream commit has a certified Bridge"
  - "SQLite MySQL and PostgreSQL round trips are not all proven"
  - "install upgrade rollback uninstall and purge round trips are not proven"
  - "no external non-production host has completed install and uninstall"
  - "release signature and image-layer SBOM are incomplete"
