stable_release_blocks:
  - "portable adapter semantic-success certification remains open for arbitrary hosts"
  - "smart state is not fully isolated into sr_* side tables"
  - "no exact upstream commit has a certified Bridge"
  - "SQLite MySQL and PostgreSQL round trips are not all proven"
  - "install upgrade rollback uninstall and purge round trips are not proven"
  - "no external non-production host has completed install and uninstall"
  - "release signature and image-layer SBOM are incomplete"
