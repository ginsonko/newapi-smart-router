name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  repository-contract:
    name: Repository contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2 jsonschema==4.24.0
      - name: Validate repository contracts
        run: python scripts/validate_repository.py --root .
      - name: Validate release tooling negative cases
        run: python -B -m unittest discover -s scripts -p 'test_*.py'
      - name: Scan public tree for secrets
        run: python scripts/secret_scan.py --root . --json "$RUNNER_TEMP/secret-scan.json"

  go-and-doctor:
    name: Go core, Bridge, and doctor
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.1"
          cache-dependency-path: |
            core/go.sum
            bridge/newapi/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test standalone core
        working-directory: core
        run: |
          go mod verify
          go test ./... -count=1
          go run ./cmd/conformance -vectors testdata/planner-v1.json
      - name: Test New API Bridge candidate
        working-directory: bridge/newapi
        run: |
          go mod verify
          go test ./... -count=1
      - name: Test read-only custom-fork doctor
        run: python -m unittest discover -s integration/doctor -p 'test_*.py'
